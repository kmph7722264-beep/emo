<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="no-referrer">
<title>系統儀表板</title>
<link rel="stylesheet" href="style.css">
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
/* ── 頂部狀態列 ────────────────────────────────────── */
.dash-header {
  display: flex; align-items: center; gap: 8px;
  padding: 10px 14px;
  background: #0d3b66; color: #fff;
  border-radius: 12px; margin-bottom: 16px;
}
.dash-header-info { flex: 1; min-width: 0; }
.dash-header-info .date-label { font-size: 12px; opacity: .75; }
.dash-header-info .meal-label { font-size: 15px; font-weight: 700; }
.dash-refresh-info { font-size: 11px; opacity: .75; text-align: right; flex-shrink: 0; }
.btn-refresh-now {
  flex-shrink: 0; all: unset; cursor: pointer;
  border: 1px solid rgba(255,255,255,.5); color: #fff;
  border-radius: 6px; padding: 4px 10px; font-size: 16px; line-height: 1;
}

/* ── 餐別摘要卡 ────────────────────────────────────── */
.meal-cards { display: flex; flex-direction: column; gap: 12px; margin-bottom: 16px; }
.meal-card-d {
  border: 1px solid var(--border); border-radius: 12px; overflow: hidden;
}
.meal-card-d.current { border-color: #22c55e; border-width: 2px; }
.mcd-head {
  display: flex; align-items: center; gap: 8px;
  padding: 9px 14px; font-weight: 700; font-size: 14px;
}
.mcd-head .cur-tag {
  margin-left: auto; font-size: 11px; font-weight: 700;
  background: #dcfce7; color: #166534; border-radius: 999px; padding: 2px 8px;
}
.mc-bf .mcd-head { background: #fffbeb; }
.mc-lu .mcd-head { background: #f0fdf4; }
.mc-dn .mcd-head { background: #eff6ff; }
.mcd-body { padding: 10px 14px; }
.mcd-nums {
  display: flex; gap: 6px; margin-bottom: 8px;
}
.mcd-num-box {
  flex: 1; text-align: center; border-radius: 8px; padding: 6px 4px;
}
.mcd-num-box .n { font-size: 22px; font-weight: 700; line-height: 1.1; }
.mcd-num-box .lbl { font-size: 10px; color: var(--muted); margin-top: 1px; }
.box-ordered  { background: #f1f5f9; }
.box-picked   { background: #dcfce7; color: #166534; }
.box-pending  { background: #fff7ed; color: #92400e; }
.box-abandoned{ background: #fee2e2; color: #991b1b; }
/* 進度條 */
.mcd-progress { position: relative; height: 8px; background: #e5e7eb; border-radius: 999px; overflow: hidden; }
.mcd-progress-bar { position: absolute; left: 0; top: 0; bottom: 0; background: #22c55e; border-radius: 999px; transition: width .3s; }

/* 中餐 A/B/C 小標 */
.lu-abc { display: flex; gap: 6px; margin-top: 6px; }
.lu-abc-item {
  flex: 1; text-align: center; font-size: 11px; font-weight: 700;
  border-radius: 6px; padding: 3px 0;
}
.lu-abc-item.A { background: #dbeafe; color: #1e40af; }
.lu-abc-item.B { background: #dcfce7; color: #166534; }
.lu-abc-item.C { background: #fef3c7; color: #92400e; }

/* ── 待領名單 ──────────────────────────────────────── */
.pending-section { margin-bottom: 16px; }
.pending-title {
  display: flex; align-items: center; gap: 8px;
  padding: 9px 14px; margin-bottom: 0;
  background: #0d3b66; color: #fff;
  border-radius: 10px 10px 0 0; font-weight: 700; font-size: 13px;
}
.pending-title .cnt-badge {
  margin-left: auto; background: #ef4444; color: #fff;
  border-radius: 999px; padding: 1px 8px; font-size: 12px;
}
.pending-list {
  border: 1px solid var(--border); border-top: 0;
  border-radius: 0 0 10px 10px; overflow: hidden;
}
.pending-item {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 14px; font-size: 13px; border-bottom: 1px solid #f1f5f9;
}
.pending-item:last-child { border-bottom: 0; }
.pending-item:nth-child(even) { background: #f8fafc; }
.pend-no {
  font: 700 11px/1 ui-monospace, Consolas, monospace;
  background: #0d3b66; color: #fff;
  border-radius: 999px; padding: 2px 7px; flex-shrink: 0;
}
.pend-name { flex: 1; }
.pend-item { font-size: 11px; color: var(--muted); }
.all-picked {
  padding: 16px 14px; text-align: center;
  color: #166534; font-weight: 700; font-size: 14px;
}
.between-meals {
  padding: 14px; text-align: center; color: var(--muted); font-size: 13px;
}

/* 備料數量欄 */
.qty-grid {
  display: flex; gap: 8px; flex-wrap: wrap;
  padding: 12px 14px;
  border: 1px solid var(--border); border-radius: 12px;
  margin-bottom: 16px; background: #f8fafc;
}
.qty-box {
  flex: 1; min-width: 60px; text-align: center;
  background: #fff; border: 1px solid var(--border); border-radius: 8px; padding: 8px 4px;
}
.qty-box .qn { font-size: 22px; font-weight: 700; }
.qty-box .ql { font-size: 11px; color: var(--muted); margin-top: 1px; }
.qty-box.ql-a { border-color: #93c5fd; }
.qty-box.ql-b { border-color: #86efac; }
.qty-box.ql-c { border-color: #fcd34d; }

.section-title {
  font-weight: 700; font-size: 13px; color: var(--muted);
  margin-bottom: 8px; letter-spacing: .5px;
}

/* 空狀態 */
.empty-dash { text-align: center; padding: 32px 20px; color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<main class="card">
  <h1>📊 系統儀表板</h1>

  <div id="denied" class="msg err" hidden>無管理員權限</div>

  <div id="content" hidden>
    <!-- 頂部狀態列 -->
    <div class="dash-header">
      <div class="dash-header-info">
        <div class="date-label" id="hdrDate">—</div>
        <div class="meal-label" id="hdrMeal">⏳ 載入中…</div>
      </div>
      <div class="dash-refresh-info" id="hdrNextRefresh"></div>
      <button type="button" class="btn-refresh-now" id="btnRefreshNow" title="立即重新整理">↺</button>
    </div>

    <!-- 備料數量 -->
    <div class="section-title">📦 備料數量（廚房）</div>
    <div id="qtySection" class="qty-grid"></div>

    <!-- 三餐摘要卡 -->
    <div class="section-title">✅ 領餐進度</div>
    <div class="meal-cards" id="mealCards"></div>

    <!-- 待領名單 -->
    <div class="pending-section" id="pendingSection"></div>
  </div>

  <p id="msg" class="msg" hidden></p>
</main>

<script>
const LIFF_ID = '2010095803-1ayMPRJ6';
const API_URL = 'https://script.google.com/macros/s/AKfycbyjoxk4f7EFUE0UR_B7ZxBVFFpJNYqo6_f8ZDYyBBkjtfr04fmzqLAxi9RpdsyhyYh15g/exec';

let idToken = '';
let refreshTimer = null;
let countdownTimer = null;
let nextRefreshSec = 60;
const REFRESH_INTERVAL = 60;

const $content  = document.getElementById('content');
const $denied   = document.getElementById('denied');
const $msg      = document.getElementById('msg');
const $hdrDate  = document.getElementById('hdrDate');
const $hdrMeal  = document.getElementById('hdrMeal');
const $hdrNext  = document.getElementById('hdrNextRefresh');

function showMsg(txt, isErr = true) {
  $msg.textContent = txt;
  $msg.className = 'msg ' + (isErr ? 'err' : 'ok');
  $msg.hidden = false;
}

// ── API ──────────────────────────────────────────────────
async function postJson(payload) {
  const res = await fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(payload),
  });
  return res.json();
}

// ── 進度條 ───────────────────────────────────────────────
function pct(a, b) { return b > 0 ? Math.round(a / b * 100) : 0; }

// ── 餐別卡片 ──────────────────────────────────────────────
function mealCard(mealKey, label, icon, bg, c, pendingArr, currentMeal, luABC) {
  const ordered   = c.ordered;
  const picked    = c.picked;
  const abandoned = c.abandoned;
  const pending   = ordered - picked - abandoned;
  const pctPicked = pct(picked, ordered);
  const isCur     = currentMeal === mealKey;

  const abcHtml = luABC ? `
    <div class="lu-abc">
      <div class="lu-abc-item A">A　${luABC.A} 份</div>
      <div class="lu-abc-item B">B　${luABC.B} 份</div>
      <div class="lu-abc-item C">C　${luABC.C} 份</div>
    </div>` : '';

  return `
  <div class="meal-card-d mc-${mealKey} ${isCur ? 'current' : ''}">
    <div class="mcd-head">
      <span>${icon} ${label}</span>
      ${isCur ? '<span class="cur-tag">▶ 當前時段</span>' : ''}
    </div>
    <div class="mcd-body">
      <div class="mcd-nums">
        <div class="mcd-num-box box-ordered">
          <div class="n">${ordered}</div><div class="lbl">訂購</div>
        </div>
        <div class="mcd-num-box box-picked">
          <div class="n">${picked}</div><div class="lbl">已領</div>
        </div>
        <div class="mcd-num-box box-pending">
          <div class="n">${pending}</div><div class="lbl">待領</div>
        </div>
        <div class="mcd-num-box box-abandoned">
          <div class="n">${abandoned}</div><div class="lbl">棄單</div>
        </div>
      </div>
      <div class="mcd-progress">
        <div class="mcd-progress-bar" style="width:${pctPicked}%"></div>
      </div>
      <div style="text-align:right;font-size:11px;color:var(--muted);margin-top:3px">領取率 ${pctPicked}%</div>
      ${abcHtml}
    </div>
  </div>`;
}

// ── 待領名單區塊 ──────────────────────────────────────────
function pendingSection(currentMeal, pending, pickupWindow) {
  const MEAL_META = {
    breakfast: { label: '早餐', icon: '🌅' },
    lunch:     { label: '中餐', icon: '☀️' },
    dinner:    { label: '晚餐', icon: '🌙' },
  };

  if (!currentMeal) {
    return `<div class="pending-title">⏳ 待領名單</div>
      <div class="pending-list"><div class="between-meals">目前非取餐時段</div></div>`;
  }

  const meta = MEAL_META[currentMeal] || { label: currentMeal, icon: '🍽' };
  const list = pending[currentMeal] || [];
  const pw   = pickupWindow?.[currentMeal];
  const winStr = pw ? `　${pw.start}–${pw.end}` : '';

  let itemsHtml = '';
  if (list.length === 0) {
    itemsHtml = `<div class="all-picked">✅ 本時段已全數領取！</div>`;
  } else {
    itemsHtml = list.map(p => `
      <div class="pending-item">
        <span class="pend-no">${p.orderNo || '—'}</span>
        <span class="pend-name">${p.unit || ''} ${p.name || ''}</span>
        <span class="pend-item">${p.item || ''}</span>
      </div>`).join('');
  }

  return `
  <div class="pending-title">
    ${meta.icon} ${meta.label} 待領名單${winStr}
    ${list.length > 0 ? `<span class="cnt-badge">${list.length}</span>` : ''}
  </div>
  <div class="pending-list">${itemsHtml}</div>`;
}

// ── 備料數量 ──────────────────────────────────────────────
function qtySection(counts) {
  const items = [
    { label: '早餐', n: counts.breakfast.ordered, cls: '' },
    { label: '中餐 A', n: counts.lunch.A, cls: 'ql-a' },
    { label: '中餐 B', n: counts.lunch.B, cls: 'ql-b' },
    { label: '中餐 C', n: counts.lunch.C, cls: 'ql-c' },
    { label: '晚餐', n: counts.dinner.ordered, cls: '' },
    { label: '現場', n: counts.walkin, cls: '' },
  ];
  return items.map(i => `
    <div class="qty-box ${i.cls}">
      <div class="qn">${i.n}</div>
      <div class="ql">${i.label}</div>
    </div>`).join('');
}

// ── 渲染 ─────────────────────────────────────────────────
function render(data) {
  const MEAL_META = {
    breakfast: { label: '早餐', icon: '🌅', bg: '#fffbeb', key: 'breakfast' },
    lunch:     { label: '中餐', icon: '☀️', bg: '#f0fdf4', key: 'lunch' },
    dinner:    { label: '晚餐', icon: '🌙', bg: '#eff6ff', key: 'dinner' },
  };
  const MEAL_LABELS = { breakfast: '早餐取餐時段', lunch: '中餐取餐時段', dinner: '晚餐取餐時段' };

  $hdrDate.textContent = '📅 ' + data.date;
  $hdrMeal.textContent = data.currentMeal
    ? (MEAL_LABELS[data.currentMeal] || data.currentMeal)
    : '— 非取餐時段';

  // 備料
  document.getElementById('qtySection').innerHTML = qtySection(data.counts);

  // 三餐卡
  const cardsHtml = ['breakfast', 'lunch', 'dinner'].map(mk => {
    const m = MEAL_META[mk];
    const luABC = mk === 'lunch' ? data.counts.lunch : null;
    return mealCard(mk, m.label, m.icon, m.bg, data.counts[mk], data.pending[mk], data.currentMeal, luABC);
  }).join('');
  document.getElementById('mealCards').innerHTML = cardsHtml;

  // 待領名單
  document.getElementById('pendingSection').innerHTML =
    pendingSection(data.currentMeal, data.pending, data.pickupWindow);
}

// ── 載入資料 ─────────────────────────────────────────────
async function loadDashboard() {
  try {
    const data = await postJson({ action: 'getDashboard', idToken });
    if (!data.ok) throw new Error(data.error || '載入失敗');
    render(data);
    $msg.hidden = true;
  } catch (e) {
    showMsg('載入失敗：' + e.message);
  }
}

// ── 自動刷新倒數 ─────────────────────────────────────────
function startRefreshCycle() {
  clearInterval(refreshTimer);
  clearInterval(countdownTimer);
  nextRefreshSec = REFRESH_INTERVAL;
  $hdrNext.textContent = `${nextRefreshSec}s 後更新`;

  countdownTimer = setInterval(() => {
    nextRefreshSec--;
    $hdrNext.textContent = `${nextRefreshSec}s 後更新`;
    if (nextRefreshSec <= 0) {
      nextRefreshSec = REFRESH_INTERVAL;
      loadDashboard();
    }
  }, 1000);
}

document.getElementById('btnRefreshNow').addEventListener('click', () => {
  nextRefreshSec = REFRESH_INTERVAL;
  loadDashboard();
});

// ── 初始化 ────────────────────────────────────────────────
(async () => {
  // 從 admin.html 開啟時，idToken 直接附在 URL 參數 ?t= 中，優先使用
  const urlToken = new URLSearchParams(location.search).get('t');
  if (urlToken) {
    idToken = urlToken;
  } else {
    // 直接開啟時走 LIFF 登入
    try {
      await liff.init({ liffId: LIFF_ID });
      if (!liff.isLoggedIn()) { liff.login(); return; }
      idToken = liff.getIDToken() || '';
    } catch (e) {
      showMsg('LIFF 初始化失敗：' + e.message);
      return;
    }
  }

  if (!idToken) {
    showMsg('無法取得身份 token，請關閉後重新開啟。');
    return;
  }

  // 驗證管理員
  try {
    const r = await postJson({ action: 'checkAdmin', idToken });
    if (!r.ok || !r.isAdmin) {
      $denied.hidden = false;
      return;
    }
  } catch (e) {
    showMsg('驗證失敗：' + e.message);
    return;
  }

  $content.hidden = false;
  await loadDashboard();
  startRefreshCycle();
})();
</script>
</body>
</html>
