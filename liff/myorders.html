<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的訂單</title>
<link rel="stylesheet" href="style.css">
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
/* ── Tab 切換 ─────────────────────────────────── */
.tab-bar {
  display: flex; gap: 0; margin-bottom: 18px;
  border: 1px solid var(--border); border-radius: 10px; overflow: hidden;
}
.tab-btn {
  flex: 1; padding: 11px 6px;
  font: 600 14px/1 inherit; color: var(--muted);
  background: #fff; border: 0; cursor: pointer;
  border-right: 1px solid var(--border);
  transition: background .15s, color .15s;
}
.tab-btn:last-child { border-right: 0; }
.tab-btn.active { background: var(--line-green); color: #fff; }

/* ── 訂單卡片 ─────────────────────────────────── */
.order-card {
  border: 1px solid var(--border); border-radius: 12px;
  margin-bottom: 14px; overflow: hidden;
}
.order-card.cancelled { opacity: .65; }

.oc-head {
  display: flex; align-items: center; gap: 8px;
  padding: 11px 14px;
  background: #f8fafc;
  border-bottom: 1px solid var(--border);
  font-size: 13px;
}
.oc-no {
  font: 700 13px/1 ui-monospace, Menlo, Consolas, monospace;
  background: var(--line-green-dark); color: #fff;
  border-radius: 999px; padding: 3px 10px;
}
.oc-date { color: var(--muted); }
.oc-cancelled-tag {
  margin-left: auto;
  background: #fee2e2; color: #991b1b;
  border-radius: 999px; padding: 2px 8px;
  font-size: 11px; font-weight: 700;
}

.oc-body { padding: 12px 14px; }
.meal-row-item {
  display: flex; align-items: flex-start; gap: 8px;
  padding: 6px 0; border-bottom: 1px solid #f1f5f9;
  font-size: 13px;
}
.meal-row-item:last-child { border-bottom: 0; }
.meal-tag {
  flex-shrink: 0; min-width: 38px;
  background: #f3f4f6; color: var(--muted);
  border-radius: 4px; padding: 2px 5px;
  font-size: 11px; font-weight: 700; text-align: center;
}
.meal-item-name { flex: 1; color: var(--text); }

/* 領餐狀態 */
.pick-badge {
  flex-shrink: 0;
  font-size: 11px; font-weight: 700;
  border-radius: 999px; padding: 2px 8px;
}
.pick-ok       { background: #dcfce7; color: #166534; }
.pick-pending  { background: #fef3c7; color: #92400e; }
.pick-abandoned{ background: #fee2e2; color: #991b1b; }

.oc-note {
  margin-top: 8px; font-size: 12px; color: var(--muted);
  padding: 6px 8px; background: #fafafa; border-radius: 6px;
}

/* 問卷按鈕 */
.oc-footer { padding: 10px 14px 12px; border-top: 1px solid var(--border); }
.btn-survey {
  display: block; width: 100%; padding: 10px;
  font: 600 14px/1 inherit; color: #fff;
  background: #0d3b66; border: 0; border-radius: 8px; cursor: pointer;
}
.btn-survey:hover { background: #1a5276; }
.btn-survey:disabled { opacity: .5; cursor: not-allowed; }
.survey-done {
  font-size: 12px; color: #166534;
  background: #dcfce7; border-radius: 6px;
  padding: 6px 10px; text-align: center;
}

/* 空狀態 */
.empty-state {
  text-align: center; padding: 48px 20px; color: var(--muted);
}
.empty-state .ei { font-size: 48px; margin-bottom: 10px; }
.empty-state p { font-size: 14px; }

/* 載入動畫 */
.loading-spin {
  display: flex; justify-content: center; padding: 40px 0;
}
.spin {
  width: 36px; height: 36px;
  border: 4px solid #e5e7eb; border-top-color: var(--line-green);
  border-radius: 50%; animation: sp .7s linear infinite;
}
@keyframes sp { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<main class="card">
  <h1>🗒 我的訂單</h1>

  <!-- Tab -->
  <div class="tab-bar">
    <button class="tab-btn active" data-tab="all">全部訂單</button>
    <button class="tab-btn" data-tab="survey">待填問卷</button>
  </div>

  <div id="listContent">
    <div class="loading-spin"><div class="spin"></div></div>
  </div>

  <p id="msg" class="msg" hidden></p>
</main>

<script>
const LIFF_ID  = '2010095803-3unJvtGw';
const API_URL  = 'https://script.google.com/macros/s/AKfycbyjoxk4f7EFUE0UR_B7ZxBVFFpJNYqo6_f8ZDYyBBkjtfr04fmzqLAxi9RpdsyhyYh15g/exec';

let idToken  = '';
let allOrders = [];
let curTab   = 'all';

const $list = document.getElementById('listContent');
const $msg  = document.getElementById('msg');

// ── 工具 ────────────────────────────────────────────────────
function fmtDate(d) {
  if (!d || d.length < 10) return d || '';
  return `${d.slice(5,7)}/${d.slice(8,10)}`;
}
function fmtTime(s) {
  if (!s) return '';
  const d = new Date(s);
  if (isNaN(d)) return '';
  return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}
function showMsg(text, type='err') {
  $msg.textContent = text; $msg.className = `msg ${type}`; $msg.hidden = false;
}

// ── Tab 切換 ─────────────────────────────────────────────────
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    curTab = btn.dataset.tab;
    render();
  });
});

// ── 渲染訂單列表 ─────────────────────────────────────────────
function mealPickBadge(picked, pickedAt, abandoned) {
  if (abandoned) return '<span class="pick-badge pick-abandoned">已棄單</span>';
  if (picked)    return `<span class="pick-badge pick-ok">已領 ${fmtTime(pickedAt)}</span>`;
  return '<span class="pick-badge pick-pending">未領</span>';
}

function renderOrder(o) {
  const meals = [];
  if (o.breakfast) meals.push({ tag:'早餐', name:o.breakfast, picked:o.breakfastPicked, at:o.breakfastPickedAt, abandoned:o.breakfastAbandoned });
  if (o.lunch)     meals.push({ tag:'中餐', name:o.lunch,     picked:o.lunchPicked,     at:o.lunchPickedAt,     abandoned:o.lunchAbandoned     });
  if (o.dinner)    meals.push({ tag:'晚餐', name:o.dinner,    picked:o.dinnerPicked,    at:o.dinnerPickedAt,    abandoned:o.dinnerAbandoned    });

  const mealRows = meals.map(m => `
    <div class="meal-row-item">
      <span class="meal-tag">${m.tag}</span>
      <span class="meal-item-name">${m.name}</span>
      ${o.cancelled ? '' : mealPickBadge(m.picked, m.at, m.abandoned)}
    </div>`).join('');

  const noteHtml = o.note
    ? `<div class="oc-note">📝 ${o.note}</div>` : '';

  const footerHtml = o.cancelled ? '' : (() => {
    if (o.surveyed) return `<div class="oc-footer"><div class="survey-done">✅ 已填寫用餐回饋問卷，謝謝！</div></div>`;
    // 只在問卷可填時顯示按鈕（訂餐日 ≤ 今日）
    const oDate = new Date(o.date);
    const today = new Date(); today.setHours(0,0,0,0);
    if (oDate > today) return '';
    return `<div class="oc-footer">
      <button class="btn-survey" data-order="${o.orderNo}" onclick="openSurvey(this)">
        📝 填寫用餐回饋問卷
      </button>
    </div>`;
  })();

  return `
  <div class="order-card ${o.cancelled ? 'cancelled' : ''}">
    <div class="oc-head">
      <span class="oc-no">${o.orderNo}</span>
      <span class="oc-date">${o.date}</span>
      ${o.walkin ? '<span style="color:#92400e;font-size:11px;font-weight:700">現場</span>' : ''}
      ${o.cancelled ? `<span class="oc-cancelled-tag">已取消${o.cancelReason ? ' · '+o.cancelReason : ''}</span>` : ''}
    </div>
    <div class="oc-body">
      ${mealRows || '<div style="color:var(--muted);font-size:13px">（無餐點）</div>'}
      ${noteHtml}
    </div>
    ${footerHtml}
  </div>`;
}

function render() {
  let list = allOrders;
  if (curTab === 'survey') {
    const today = new Date(); today.setHours(0,0,0,0);
    list = allOrders.filter(o =>
      !o.cancelled && !o.surveyed && new Date(o.date) <= today
    );
  }
  if (!list.length) {
    $list.innerHTML = `
      <div class="empty-state">
        <div class="ei">${curTab === 'survey' ? '✅' : '📭'}</div>
        <p>${curTab === 'survey' ? '目前沒有待填的問卷，感謝您！' : '尚無訂單紀錄'}</p>
      </div>`;
    return;
  }
  $list.innerHTML = list.map(renderOrder).join('');
}

// ── 開啟問卷 ─────────────────────────────────────────────────
async function openSurvey(btn) {
  btn.disabled = true;
  btn.textContent = '取得連結中…';
  try {
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'requestSurveyLink', idToken, orderNo: btn.dataset.order }),
    });
    const data = await res.json();
    if (!data.ok) throw new Error(data.error);
    if (!data.url) throw new Error('問卷功能尚未啟用（請聯絡管理員設定 LIFF_SURVEY_URL）');
    if (window.liff && liff.openWindow) {
      liff.openWindow({ url: data.url, external: false });
    } else {
      location.href = data.url;
    }
  } catch (e) {
    showMsg(e.message);
    btn.disabled = false;
    btn.textContent = '📝 填寫用餐回饋問卷';
  }
}

// ── 載入訂單 ─────────────────────────────────────────────────
async function loadOrders() {
  $list.innerHTML = '<div class="loading-spin"><div class="spin"></div></div>';
  $msg.hidden = true;
  try {
    const res  = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'getMyOrders', idToken, limit: 50 }),
    });
    const data = await res.json();
    if (!data.ok) throw new Error(data.error);
    allOrders = data.orders || [];
    // URL 帶 survey=1 → 預設開啟「待填問卷」Tab
    if (new URLSearchParams(location.search).get('survey') === '1') {
      document.querySelectorAll('.tab-btn').forEach(b => {
        b.classList.toggle('active', b.dataset.tab === 'survey');
      });
      curTab = 'survey';
    }
    render();
  } catch (e) {
    $list.innerHTML = '';
    showMsg('載入失敗：' + e.message);
  }
}

// ── LIFF 初始化 ──────────────────────────────────────────────
(async () => {
  try {
    await liff.init({ liffId: LIFF_ID });
    if (!liff.isLoggedIn()) { liff.login(); return; }
    idToken = liff.getIDToken() || '';
  } catch (e) {
    showMsg('LIFF 初始化失敗：' + e);
    return;
  }
  loadOrders();
})();
</script>
</body>
</html>
