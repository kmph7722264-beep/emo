<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>雄好築軒智慧用餐管理頁 - 樣式預覽 (Mock)</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="card">
  <h1>管理員後台</h1>
  <p class="hint">★ 樣式預覽模式 — 假資料，未連接 LIFF/GAS。</p>

  <fieldset>
    <legend>當日訂單統計</legend>
    <label>日期
      <input type="date" id="statsDate">
    </label>
    <button type="button" class="secondary">查詢</button>

    <div id="statsResult">
      <div class="stats-grid">
        <div class="stat"><span class="stat-num">12</span><span>總筆數</span></div>
        <div class="stat"><span class="stat-num">5</span><span>早餐</span></div>
        <div class="stat"><span class="stat-num">4</span><span>中餐 A</span></div>
        <div class="stat"><span class="stat-num">3</span><span>中餐 B</span></div>
        <div class="stat"><span class="stat-num">2</span><span>中餐 C</span></div>
        <div class="stat"><span class="stat-num">7</span><span>晚餐</span></div>
      </div>
      <details class="order-list" open>
        <summary>訂單明細 (12 筆)</summary>
        <div id="orderList">
          <div class="order-row">
            <div class="order-head"><strong>研發部 / 王小明</strong> 0912-345-678</div>
            <div class="order-meals">早:三明治  午:A 餐：滷雞腿便當  晚:紅燒牛肉麵</div>
            <div class="order-note">備註：飯少一點</div>
          </div>
          <div class="order-row">
            <div class="order-head"><strong>業務部 / 林佳玲</strong> 0922-111-222</div>
            <div class="order-meals">午:B 餐：排骨便當</div>
          </div>
          <div class="order-row">
            <div class="order-head"><strong>會計室 / 陳大華</strong> 0933-444-555</div>
            <div class="order-meals">早:飯糰  晚:紅燒牛肉麵</div>
            <div class="order-note">備註：不要香菜、不要辣</div>
          </div>
          <div class="order-row">
            <div class="order-head"><strong>總務 / 黃淑芬</strong> 0955-666-777</div>
            <div class="order-meals">午:C 餐：素食便當</div>
          </div>
        </div>
      </details>
    </div>
  </fieldset>

  <h2>每日餐點維護</h2>
  <form>
    <label>早餐
      <input value="飯糰 / 三明治 / 蛋餅" placeholder="例：燒餅油條">
    </label>
    <label>中餐 A
      <input value="滷雞腿便當">
    </label>
    <label>中餐 B
      <input value="排骨便當">
    </label>
    <label>中餐 C
      <input value="素食便當">
    </label>
    <label>晚餐
      <input value="紅燒牛肉麵">
    </label>

    <button type="button">儲存</button>
  </form>

  <p class="msg ok">已更新</p>
  <p class="footer"><a href="order.html">回訂餐頁</a></p>
</main>

<script>
  document.getElementById('statsDate').valueAsDate = new Date();
</script>
</body>
</html>
