<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EMO 點餐 - 管理員</title>
<link rel="stylesheet" href="style.css">
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body>
<main class="card">
  <h1>管理員後台</h1>
  <p class="hint">僅限白名單管理員。</p>

  <fieldset>
    <legend>當日訂單統計</legend>
    <label>日期
      <input type="date" id="statsDate">
    </label>
    <button type="button" id="statsBtn" class="secondary">查詢</button>

    <div id="statsResult" hidden>
      <div class="stats-grid">
        <div class="stat"><span class="stat-num" id="cTotal">0</span><span>總筆數</span></div>
        <div class="stat"><span class="stat-num" id="cBreakfast">0</span><span>早餐</span></div>
        <div class="stat"><span class="stat-num" id="cDinner">0</span><span>晚餐</span></div>
        <div class="stat"><span class="stat-num" id="cLunchA">0</span><span>中餐 A</span></div>
        <div class="stat"><span class="stat-num" id="cLunchB">0</span><span>中餐 B</span></div>
        <div class="stat"><span class="stat-num" id="cLunchC">0</span><span>中餐 C</span></div>
        <div class="stat stat-picked"><span class="stat-num" id="cBreakfastPicked">0/0</span><span>早餐已領</span></div>
        <div class="stat stat-picked"><span class="stat-num" id="cLunchPicked">0/0</span><span>中餐已領</span></div>
        <div class="stat stat-picked"><span class="stat-num" id="cDinnerPicked">0/0</span><span>晚餐已領</span></div>
      </div>

      <details class="order-list" open>
        <summary>訂單明細 (<span id="cListTotal">0</span> 筆)</summary>
        <label class="filter-row">
          <input type="checkbox" id="filterUnpicked"> 只看未領餐
        </label>
        <div id="orderList"></div>
      </details>
    </div>
  </fieldset>

  <fieldset>
    <legend>領餐快速查詢</legend>
    <label>訂單編號
      <input type="text" id="pickupNo" placeholder="例：20260520-001 或按右側「掃描 QR」" autocomplete="off" inputmode="text">
    </label>
    <div class="btn-row">
      <button type="button" id="pickupScanBtn" class="secondary">📷 掃描 QR</button>
      <button type="button" id="pickupFindBtn" class="secondary">查詢</button>
    </div>
    <div id="pickupResult" hidden></div>
  </fieldset>

  <h2>每日餐點維護</h2>
  <p class="hint">可指定特定日期；新日期可直接儲存（系統先帶入最近一日的菜單作為基底）。</p>
  <form id="menuForm">
    <label>適用日期
      <input type="date" id="menuDate">
    </label>
    <div class="btn-row">
      <button type="button" id="menuLoadBtn" class="secondary">載入該日菜單</button>
    </div>
    <small class="field-hint" id="menuOrdered">當日已訂數量載入中…</small>

    <label>早餐
      <input name="早餐" placeholder="例：燒餅油條 / 飯糰 / 三明治">
    </label>
    <label>中餐 A
      <input name="中餐A" placeholder="例：滷雞腿便當">
    </label>
    <label>中餐 B
      <input name="中餐B" placeholder="例：排骨便當">
    </label>
    <label>中餐 C
      <input name="中餐C" placeholder="例：素食便當">
    </label>
    <label>晚餐
      <input name="晚餐" placeholder="例：紅燒牛肉麵">
    </label>

    <button type="submit" id="submitBtn">儲存當日菜單</button>
  </form>

  <p id="msg" class="msg" hidden></p>
  <p class="footer"><a href="#" id="orderEntry">回訂餐頁</a></p>
</main>

<script>
const LIFF_ID = '2010095803-1ayMPRJ6';
const API_URL = 'https://script.google.com/macros/s/AKfycbyjoxk4f7EFUE0UR_B7ZxBVFFpJNYqo6_f8ZDYyBBkjtfr04fmzqLAxi9RpdsyhyYh15g/exec';

let idToken = '';
let lastStats = null;

async function init() {
  try {
    await liff.init({ liffId: LIFF_ID });
    if (!liff.isLoggedIn()) { liff.login(); return; }
    idToken = liff.getIDToken() || '';
  } catch (e) {
    showMsg('LIFF 初始化失敗：' + e.message, true);
    return;
  }

  const today = new Date();
  document.getElementById('statsDate').valueAsDate = today;
  document.getElementById('menuDate').valueAsDate  = today;

  await loadMenuForDate(toDateStr(today));
  await loadStats({ silent: true });

  document.getElementById('statsBtn').addEventListener('click', () => loadStats());
  document.getElementById('menuLoadBtn').addEventListener('click', () => {
    const d = document.getElementById('menuDate').value;
    if (!d) { showMsg('請選擇日期', true); return; }
    loadMenuForDate(d);
  });
  document.getElementById('menuForm').addEventListener('submit', onSubmitMenu);
  document.getElementById('pickupFindBtn').addEventListener('click', onFindOrder);
  document.getElementById('pickupScanBtn').addEventListener('click', onScanCode);
  document.getElementById('pickupNo').addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); onFindOrder(); }
  });
  document.getElementById('filterUnpicked').addEventListener('change', renderOrderList);

  const orderLink = document.getElementById('orderEntry');
  if (orderLink) {
    orderLink.addEventListener('click', e => {
      e.preventDefault();
      const url = 'https://liff.line.me/2010095803-Neg2TBst';
      if (window.liff && typeof liff.openWindow === 'function') {
        liff.openWindow({ url, external: false });
      } else {
        window.location.href = url;
      }
    });
  }
}

function toDateStr(d) {
  const pad = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
}

async function postJson(payload) {
  const res = await fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(payload),
  });
  return res.json();
}

async function loadStats(opts) {
  const silent = !!(opts && opts.silent);
  const date = document.getElementById('statsDate').value;
  if (!date) { if (!silent) showMsg('請選擇日期', true); return; }
  try {
    const data = await postJson({ action: 'stats', idToken, date });
    if (!data.ok) throw new Error(data.error || '查詢失敗');
    lastStats = data;
    renderStats();
  } catch (e) {
    if (!silent) showMsg('統計查詢失敗：' + e.message, true);
  }
}

function renderStats() {
  if (!lastStats) return;
  const c = lastStats.counts;
  const lunchTotal = (c.lunchA || 0) + (c.lunchB || 0) + (c.lunchC || 0) + (c.lunchOther || 0);
  document.getElementById('cTotal').textContent     = lastStats.total;
  document.getElementById('cBreakfast').textContent = c.breakfast;
  document.getElementById('cDinner').textContent    = c.dinner;
  document.getElementById('cLunchA').textContent    = c.lunchA;
  document.getElementById('cLunchB').textContent    = c.lunchB;
  document.getElementById('cLunchC').textContent    = c.lunchC;
  document.getElementById('cBreakfastPicked').textContent = `${c.breakfastPicked}/${c.breakfast}`;
  document.getElementById('cLunchPicked').textContent     = `${c.lunchPicked}/${lunchTotal}`;
  document.getElementById('cDinnerPicked').textContent    = `${c.dinnerPicked}/${c.dinner}`;
  document.getElementById('cListTotal').textContent = lastStats.total;
  document.getElementById('statsResult').hidden = false;
  renderOrderList();
}

function renderOrderList() {
  if (!lastStats) return;
  const onlyUnpicked = document.getElementById('filterUnpicked').checked;
  const list = document.getElementById('orderList');
  list.innerHTML = '';
  const filtered = lastStats.orders.filter(o => !onlyUnpicked || hasUnpickedMeal(o));

  if (filtered.length === 0) {
    list.innerHTML = '<div class="empty-hint">無符合條件的訂單</div>';
    return;
  }

  filtered.forEach(o => list.appendChild(buildOrderCard(o)));
}

function hasUnpickedMeal(o) {
  return (o.breakfast && !o.breakfastPicked) ||
         (o.lunch     && !o.lunchPicked) ||
         (o.dinner    && !o.dinnerPicked);
}

function mealLabel(meal) {
  return ({ breakfast: '早餐', lunch: '中餐', dinner: '晚餐' })[meal] || meal;
}

function buildMealRowsHtml(o) {
  const meals = [
    { key: 'breakfast', label: '早', name: o.breakfast, picked: o.breakfastPicked },
    { key: 'lunch',     label: '午', name: o.lunch,     picked: o.lunchPicked },
    { key: 'dinner',    label: '晚', name: o.dinner,    picked: o.dinnerPicked },
  ];
  const orderAttr = escapeHtml(o.orderNo || '');
  return meals.filter(m => m.name).map(m => {
    const badge = m.picked
      ? `<span class="badge picked">已領 ✓</span>`
      : `<span class="badge unpicked">未領</span>`;
    const btn = m.picked
      ? `<button type="button" class="btn-mini btn-undo" data-meal="${m.key}" data-action="unpick" data-order="${orderAttr}">取消已領</button>`
      : `<button type="button" class="btn-mini btn-pick" data-meal="${m.key}" data-action="pick"   data-order="${orderAttr}">標記已領</button>`;
    return `
      <div class="meal-row ${m.picked ? 'picked' : 'unpicked'}">
        <span class="meal-label">${m.label}</span>
        <span class="meal-name">${escapeHtml(m.name)}</span>
        ${badge}
        ${btn}
      </div>`;
  }).join('');
}

function buildOrderCard(o) {
  const div = document.createElement('div');
  const hasAny = !!(o.breakfast || o.lunch || o.dinner);
  const allPicked = hasAny && !hasUnpickedMeal(o);
  div.className = 'order-row' + (allPicked ? ' picked' : ' unpicked');

  const headLeft = [
    o.unit && escapeHtml(o.unit),
    `<strong>${escapeHtml(o.name)}</strong>`,
    o.phone && escapeHtml(o.phone),
  ].filter(Boolean).join('｜');

  const orderNoHtml = o.orderNo
    ? `<span class="order-no">${escapeHtml(o.orderNo)}</span>` : '';

  div.innerHTML = `
    <div class="order-head">
      ${orderNoHtml}
      <div class="order-meta">${headLeft}</div>
    </div>
    <div class="meal-list">${buildMealRowsHtml(o)}</div>
    ${o.note ? `<div class="order-note">備註：${escapeHtml(o.note)}</div>` : ''}
  `;

  div.querySelectorAll('button[data-action]').forEach(btn => {
    btn.addEventListener('click', async ev => {
      const orderNo = ev.currentTarget.dataset.order;
      const meal    = ev.currentTarget.dataset.meal;
      const picked  = ev.currentTarget.dataset.action === 'pick';
      await markPickup(orderNo, meal, picked);
    });
  });
  return div;
}

async function markPickup(orderNo, meal, picked) {
  if (!orderNo) { showMsg('此筆訂單無編號，無法標記', true); return; }
  if (!meal)    { showMsg('缺少餐別參數', true); return; }
  try {
    const data = await postJson({ action: 'markPickup', idToken, orderNo, meal, picked });
    if (!data.ok) throw new Error(data.error || '更新失敗');
    showMsg(`${orderNo} ${mealLabel(meal)}${picked ? '已標記為已領' : '已取消已領'}`);
    if (lastStats) {
      const o = lastStats.orders.find(x => x.orderNo === orderNo);
      if (o) {
        const pickKey = meal + 'Picked';
        const atKey   = meal + 'PickedAt';
        const wasPicked = !!o[pickKey];
        o[pickKey] = picked;
        o[atKey]   = picked ? new Date().toISOString() : '';
        if (wasPicked !== picked) {
          lastStats.counts[pickKey] = (lastStats.counts[pickKey] || 0) + (picked ? 1 : -1);
        }
        renderStats();
      }
    }
    // 若是從快速查單觸發的，更新該卡片
    refreshPickupCard(orderNo);
  } catch (e) {
    showMsg('標記失敗：' + e.message, true);
  }
}

async function onScanCode() {
  if (!window.liff) {
    alert('LIFF SDK 未載入，請重新整理頁面');
    return;
  }
  if (typeof liff.isInClient === 'function' && !liff.isInClient()) {
    alert('QR 掃描功能僅能在 LINE 內使用。\n請改從 LINE 開啟管理 LIFF 短網址，或手動輸入訂單編號。');
    return;
  }
  if (typeof liff.scanCodeV2 !== 'function') {
    alert('此 LINE 版本不支援 QR 掃描，請更新 LINE App 至最新版');
    return;
  }
  try {
    const result = await liff.scanCodeV2();
    const v = result && result.value ? String(result.value).trim() : '';
    if (!v) return;
    document.getElementById('pickupNo').value = v;
    await onFindOrder();
  } catch (e) {
    const msg = String((e && e.message) || e || '');
    if (/cancel/i.test(msg) || /user.*cancel/i.test(msg)) return;
    alert('掃描失敗：' + msg + '\n\n請確認 LINE Developers Console → 管理 LIFF → Scan QR 已設為 ON。');
  }
}

async function onFindOrder() {
  const orderNo = document.getElementById('pickupNo').value.trim();
  if (!orderNo) { showMsg('請輸入訂單編號', true); return; }
  try {
    const data = await postJson({ action: 'findOrder', idToken, orderNo });
    if (!data.ok) throw new Error(data.error || '查無此單');
    renderPickupResult(data.order);
  } catch (e) {
    renderPickupError(e.message);
  }
}

function renderPickupResult(o) {
  const box = document.getElementById('pickupResult');
  const headLeft = [
    o.unit && escapeHtml(o.unit),
    `<strong>${escapeHtml(o.name)}</strong>`,
    o.phone && escapeHtml(o.phone),
  ].filter(Boolean).join('｜');

  const hasAny = !!(o.breakfast || o.lunch || o.dinner);
  const allPicked = hasAny && !hasUnpickedMeal(o);

  const pickTimes = [
    { label: '早餐', at: o.breakfastPickedAt, has: !!o.breakfast },
    { label: '中餐', at: o.lunchPickedAt,     has: !!o.lunch },
    { label: '晚餐', at: o.dinnerPickedAt,    has: !!o.dinner },
  ].filter(r => r.has && r.at)
   .map(r => `<div class="order-note">${r.label}領餐時間：${escapeHtml(formatLocal(r.at))}</div>`)
   .join('');

  box.hidden = false;
  box.className = 'pickup-card ' + (allPicked ? 'picked' : 'unpicked');
  box.innerHTML = `
    <div class="order-head">
      <span class="order-no">${escapeHtml(o.orderNo)}</span>
      <div class="order-meta">${headLeft}</div>
    </div>
    <div class="order-meals">日期 ${escapeHtml(o.date)}</div>
    <div class="meal-list">${buildMealRowsHtml(o)}</div>
    ${o.note ? `<div class="order-note">備註：${escapeHtml(o.note)}</div>` : ''}
    ${pickTimes}
  `;
  box.querySelectorAll('button[data-action]').forEach(btn => {
    btn.addEventListener('click', async ev => {
      const orderNo = ev.currentTarget.dataset.order;
      const meal    = ev.currentTarget.dataset.meal;
      const picked  = ev.currentTarget.dataset.action === 'pick';
      await markPickup(orderNo, meal, picked);
    });
  });
}

function refreshPickupCard(orderNo) {
  const box = document.getElementById('pickupResult');
  if (box.hidden) return;
  const cur = box.querySelector('.order-no');
  if (!cur || cur.textContent !== orderNo) return;
  // 重新查單以反映最新狀態
  onFindOrder();
}

function renderPickupError(msg) {
  const box = document.getElementById('pickupResult');
  box.hidden = false;
  box.className = 'pickup-card err';
  box.innerHTML = `<div class="order-note err">${escapeHtml(msg)}</div>`;
}

function formatLocal(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  if (isNaN(d)) return iso;
  const pad = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

async function loadMenuForDate(date) {
  const hint = document.getElementById('menuOrdered');
  try {
    const url = API_URL + '?action=menu' + (date ? '&date=' + encodeURIComponent(date) : '');
    const res = await fetch(url);
    const data = await res.json();
    if (!data.ok) throw new Error(data.error);
    Object.entries(data.menu).forEach(([k, v]) => {
      const el = document.querySelector(`input[name="${k}"]`);
      if (el) el.value = v;
    });
    if (hint) {
      if (data.remaining && typeof data.limit === 'number') {
        const r = data.remaining, lim = data.limit;
        hint.textContent =
          `${data.date || date} 中餐已訂｜A ${lim - r.A}／B ${lim - r.B}／C ${lim - r.C}（上限 ${lim}）`;
      } else {
        hint.textContent = '';
      }
    }
  } catch (e) {
    if (hint) hint.textContent = '';
    showMsg('載入菜單失敗：' + e.message, true);
  }
}

async function onSubmitMenu(ev) {
  ev.preventDefault();
  const btn = document.getElementById('submitBtn');
  btn.disabled = true;

  const date = document.getElementById('menuDate').value;
  if (!date) { showMsg('請選擇日期', true); btn.disabled = false; return; }

  const fd = new FormData(ev.target);
  const menu = Object.fromEntries(fd.entries());

  try {
    const data = await postJson({ action: 'updateMenu', idToken, date, menu });
    if (!data.ok) throw new Error(data.error || '儲存失敗');
    showMsg(`已更新 ${date} 的菜單`);
  } catch (e) {
    showMsg('儲存失敗：' + e.message, true);
  } finally {
    btn.disabled = false;
  }
}

function showMsg(text, isErr) {
  const el = document.getElementById('msg');
  el.textContent = text;
  el.className = 'msg ' + (isErr ? 'err' : 'ok');
  el.hidden = false;
}

init();
</script>
</body>
</html>
