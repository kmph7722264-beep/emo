<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EMO 問卷 — 模擬預覽</title>
<link rel="stylesheet" href="style.css">
<style>
  /* ── 問卷專用樣式（與 survey.html 相同） ── */
  .survey-banner { padding: 20px 16px; border-radius: 12px; text-align: center; margin: 16px 0; }
  .survey-banner.err  { background: #fff1f0; color: #b3261e; border: 1px solid #f5c2c0; }
  .survey-banner.info { background: #eef6ff; color: #0d3b66; border: 1px solid #cfe1f7; }
  .survey-banner.ok   { background: #ecfdf3; color: #047a3a; border: 1px solid #c6efd6; }
  .survey-banner h2 { margin: 0 0 6px; font-size: 17px; }
  .survey-banner p  { margin: 0; font-size: 14px; }

  .meals-picked { background: #f7f8fa; border-radius: 8px; padding: 10px 12px; font-size: 13px; color: #1a1a1a; }
  .meals-picked div { margin: 2px 0; }

  .rating-row {
    display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px;
  }
  .rating-row label {
    flex: 1; min-width: 48px; padding: 10px 4px; border: 1px solid var(--border);
    border-radius: 8px; text-align: center; cursor: pointer; background: #fff;
    font-size: 14px; user-select: none;
  }
  .rating-row label.active {
    background: var(--line-green); color: #fff; border-color: var(--line-green-dark);
    font-weight: bold;
  }
  .rating-row input[type=radio] { display: none; }

  /* ── 模擬切換工具列 ── */
  .mock-bar {
    position: sticky; top: 0; z-index: 100;
    background: #1e293b; color: #f1f5f9;
    padding: 8px 14px;
    font-size: 12px;
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
  }
  .mock-bar strong { color: #fbbf24; margin-right: 4px; }
  .mock-btn {
    padding: 4px 10px; border: 1px solid #475569; border-radius: 6px;
    background: #334155; color: #f1f5f9; cursor: pointer; font-size: 12px;
  }
  .mock-btn:hover  { background: #475569; }
  .mock-btn.active { background: #06c755; border-color: #06c755; color: #fff; }
</style>
</head>
<body>

<!-- 模擬切換工具列 -->
<div class="mock-bar">
  <strong>★ 模擬預覽</strong>
  <button class="mock-btn active" onclick="showState('form')">問卷表單</button>
  <button class="mock-btn" onclick="showState('loading')">載入中</button>
  <button class="mock-btn" onclick="showState('expired')">已過期</button>
  <button class="mock-btn" onclick="showState('duplicate')">已填過</button>
  <button class="mock-btn" onclick="showState('thanks')">送出完成</button>
</div>

<main class="card">
  <h1>📝 用餐回饋問卷</h1>

  <!-- 狀態 1：載入中 -->
  <div id="state-loading" class="survey-banner info" hidden>
    <h2>檢查問卷有效性…</h2>
    <p>請稍候</p>
  </div>

  <!-- 狀態 2：已過期 / 無效 -->
  <div id="state-expired" class="survey-banner err" hidden>
    <h2>問卷已過期失效</h2>
    <p>此問卷連結僅限當日有效，如有疑問請聯繫管理人員。</p>
  </div>

  <!-- 狀態 2b：已填過 -->
  <div id="state-duplicate" class="survey-banner err" hidden>
    <h2>已提交過問卷</h2>
    <p>您已填寫過本次問卷，感謝您的回饋！</p>
  </div>

  <!-- 狀態 3：問卷表單 -->
  <form id="state-form" onsubmit="handleSubmit(event)">

    <fieldset>
      <legend>訂單資訊</legend>
      <div class="meals-picked">
        <div><strong>訂單編號</strong>　20260524-001</div>
        <div><strong>訂購日期</strong>　2026-05-24</div>
        <div><strong>單位</strong>　警備隊</div>
        <div><strong>訂購人</strong>　王小明</div>
        <div><strong>已領餐點</strong></div>
        <div>　・早餐：飯糰</div>
        <div>　・中餐：A 餐：滷雞腿便當</div>
        <div>　・晚餐：紅燒牛肉麵</div>
      </div>
    </fieldset>

    <fieldset>
      <legend>整體滿意度 <span class="req">*</span></legend>
      <div class="rating-row" data-name="overall"></div>
    </fieldset>

    <fieldset>
      <legend>餐點品質 <span class="req">*</span></legend>
      <div class="rating-row" data-name="food"></div>
    </fieldset>

    <fieldset>
      <legend>服務態度 <span class="req">*</span></legend>
      <div class="rating-row" data-name="service"></div>
    </fieldset>

    <fieldset>
      <legend>其他建議</legend>
      <textarea name="comment" rows="3" maxlength="500"
        placeholder="想說的話、改善建議…（最多 500 字）"></textarea>
    </fieldset>

    <button type="submit" id="submitBtn">送出問卷</button>
  </form>

  <!-- 狀態 4：送出完成 -->
  <div id="state-thanks" class="survey-banner ok" hidden>
    <h2>✅ 已收到您的回饋</h2>
    <p>感謝您撥空填寫，期待下次為您服務。</p>
  </div>

  <p id="msg" class="msg" hidden></p>
</main>

<script>
const RATING_LABELS = ['1 很差', '2 不滿意', '3 普通', '4 滿意', '5 很好'];

function buildRatings() {
  document.querySelectorAll('.rating-row').forEach(row => {
    const name = row.dataset.name;
    row.innerHTML = RATING_LABELS.map((label, i) => {
      const v = i + 1;
      return `<label data-value="${v}">
        <input type="radio" name="${name}" value="${v}">
        ${label}
      </label>`;
    }).join('');
    row.addEventListener('click', ev => {
      const lbl = ev.target.closest('label');
      if (!lbl) return;
      row.querySelectorAll('label').forEach(l => l.classList.toggle('active', l === lbl));
    });
  });
}

const ALL_STATES = ['loading', 'expired', 'duplicate', 'form', 'thanks'];

function showState(name) {
  ALL_STATES.forEach(s => {
    const el = document.getElementById('state-' + s);
    if (el) el.hidden = (s !== name);
  });
  document.getElementById('msg').hidden = true;
  document.querySelectorAll('.mock-btn').forEach(btn => {
    btn.classList.toggle('active', btn.textContent.includes(
      { form:'問卷表單', loading:'載入中', expired:'已過期', duplicate:'已填過', thanks:'送出完成' }[name]
    ));
  });
}

function handleSubmit(ev) {
  ev.preventDefault();
  const fd = new FormData(ev.target);
  if (!fd.get('overall') || !fd.get('food') || !fd.get('service')) {
    const msg = document.getElementById('msg');
    msg.textContent = '請完成全部評分項目';
    msg.className = 'msg err';
    msg.hidden = false;
    return;
  }
  showState('thanks');
}

buildRatings();
showState('form');
</script>
</body>
</html>
